version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: betoch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: betoch_admin
      POSTGRES_PASSWORD: betoch_secure_password_2026
      POSTGRES_DB: betoch_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betoch_admin -d betoch_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.api
    container_name: betoch-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://betoch_admin:betoch_secure_password_2026@postgres:5432/betoch_dev
      JWT_SECRET: production-jwt-secret-replace-in-vault-min-32-chars!
      JWT_REFRESH_SECRET: production-refresh-secret-replace-in-vault-min-32-chars!
      COOKIE_SECRET: production-cookie-secret-replace-in-vault-min-32-chars!
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    volumes:
      - ./uploads:/app/uploads

  web:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.web
    container_name: betoch-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  postgres_data:
    driver: local
